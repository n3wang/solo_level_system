# Set 1 Workouts — locked-by-default exercise set
# Exercises here are NOT unlocked by default. They ship as locked `exercise`
# cards in the Motivation/Cards hub and only appear in the exercise pickers
# once their card is acquired. Same schema as default_workouts.yaml.

exercises:

  - name: "Treadmill running or walking"
    icon: "treadmill_running_or_walking"
    description: "Cardiovascular exercise for endurance"
    instructions:
      - "Start at comfortable pace"
      - "Maintain steady rhythm"
      - "Adjust speed as needed"
      - "Focus on breathing"
    default_sets: [1, 2, 3]
    default_reps: 0  # Duration-based
    default_duration: 600  # 10 minutes
    tags: ["gym", "full_body", "machine", "beginner", "cardio"]
    audio_file: "audio/workouts/treadmill_running.mp3"

  - name: "Stationary bike / spin bike"
    icon: "stationary_bike_spin_bike"
    description: "Low-impact cardiovascular exercise"
    instructions:
      - "Adjust seat height"
      - "Start pedaling"
      - "Maintain steady pace"
      - "Adjust resistance as needed"
    default_sets: [1, 2, 3]
    default_reps: 0  # Duration-based
    default_duration: 600  # 10 minutes
    tags: ["gym", "full_body", "machine", "beginner", "cardio"]
    audio_file: "audio/workouts/stationary_bike.mp3"
