version: 1
rooms:
  - id: room-like-a-dog
    name: Like a Dog
    description: Energetic, playful room with the Like a Dog lofi pack.
    iconAssetPath: assets/images/album/like_a_dog_1.gif
    trackRegex: '(?i)^like_a_dog_\d+\.(mp3|wav|m4a|aac|ogg|flac)$'
    visuals:
      - assets/images/album/like_a_dog_1.gif
      - assets/images/album/like_a_dog_2.gif
      - assets/images/album/like_a_dog_3.gif
      - assets/images/album/like_a_dog_4.gif
      - assets/images/album/like_a_dog_5.gif
      - assets/images/album/like_a_dog_6.gif
      - assets/images/album/like_a_dog_7.gif
    phrases:
      - Keep momentum and enjoy the flow.
      - One focused set at a time.
      - Keep moving, keep learning.

  - id: room-ghost-lofis
    name: Ghost Lofis
    description: Chill, atmospheric room with ghost-themed lo-fi.
    iconAssetPath: assets/images/album/ghost_lofi_1.gif
    trackRegex: '(?i)^ghost_lofi_\d+\.(mp3|wav|m4a|aac|ogg|flac)$'
    visuals:
      - assets/images/album/ghost_lofi_1.gif
      - assets/images/album/ghost_lofi_2.gif
      - assets/images/album/ghost_lofi_3.gif
      - assets/images/album/ghost_lofi_4.gif
    phrases:
      - Stay calm and keep the rhythm.
      - Quiet mind, clear output.
      - Slow pace, strong focus.

  - id: room-lab
    name: Lab
    description: Experimental lab ambience for deep work sessions.
    iconAssetPath: assets/images/album/lab_1.gif
    trackRegex: '(?i)^lab_\d+\.(mp3|wav|m4a|aac|ogg|flac)$'
    visuals:
