    name: 90s Jap
    description: Retro 90s Japanese vibes for focused sessions.
    iconAssetPath: assets/images/album/90s_jap_1.gif
    trackRegex: '(?i)^90s_jap_\d+\.(mp3|wav|m4a|aac|ogg|flac)$'
    visuals:
      - assets/images/album/90s_jap_1.gif
      - assets/images/album/90s_jap_2.gif
