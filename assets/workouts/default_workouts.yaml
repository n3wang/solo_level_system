# Default Workouts Configuration
# Contains all default exercises and routines with their metadata

exercises:

  - name: "back squat"
    icon: "back_squat"
    description: "Compound lower body exercise targeting quadriceps, glutes, and core"
    instructions:
      - "Stand with feet shoulder-width apart"
      - "Place barbell on upper back"
      - "Lower down by bending knees and hips"
      - "Keep chest up and core engaged"
      - "Drive through heels to return to standing"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "legs", "barbell", "intermediate", "strength"]
    audio_file: "audio/workouts/back_squat.mp3"

  - name: "front squat"
    icon: "front_squat"
    description: "Quadriceps-focused squat variation with front-loaded weight"
    instructions:
      - "Stand with feet shoulder-width apart"
      - "Hold barbell in front of shoulders"
      - "Lower down by bending knees"
      - "Keep torso upright"
      - "Drive through heels to stand"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "legs", "barbell", "intermediate", "strength"]
    audio_file: "audio/workouts/front_squat.mp3"

  - name: "Deadlift conventional"
    icon: "deadlift_conventional"
    description: "Full-body compound movement targeting posterior chain"
    instructions:
      - "Stand with feet hip-width apart"
      - "Bend down and grip barbell"
      - "Keep back straight and core tight"
      - "Drive through heels to lift"
      - "Stand tall at the top"
    default_sets: [1, 2, 3]
    default_reps: 5
    tags: ["gym", "back", "barbell", "intermediate", "strength"]
    audio_file: "audio/workouts/deadlift_conventional.mp3"

  - name: "Deadlift Romanian"
    icon: "deadlift_romanian"
    description: "Hamstring and glute focused deadlift variation"
    instructions:
      - "Hold barbell at hip level"
      - "Hinge at hips, keeping legs straight"
      - "Lower barbell along legs"
      - "Feel stretch in hamstrings"
      - "Return to standing position"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "back", "barbell", "intermediate", "strength"]
    audio_file: "audio/workouts/deadlift_romanian.mp3"

  - name: "Bench press"
    icon: "bench_press"
    description: "Upper body compound exercise primarily targeting chest"
    instructions:
      - "Lie on bench with feet flat"
      - "Grip barbell slightly wider than shoulders"
      - "Lower to chest with control"
      - "Press up explosively"
      - "Keep core engaged throughout"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "chest", "barbell", "intermediate", "strength"]
    audio_file: "audio/workouts/bench_press.mp3"

  - name: "Overhead press"
    icon: "overhead_press"
    description: "Shoulder and tricep focused pressing movement"
    instructions:
      - "Stand with feet shoulder-width apart"
      - "Hold barbell at shoulder level"
      - "Press overhead until arms are straight"
      - "Lower with control"
      - "Keep core tight"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "shoulders", "barbell", "intermediate", "strength"]
    audio_file: "audio/workouts/overhead_press.mp3"

  - name: "Pull-ups"
    icon: "pullups"
    description: "Upper body pulling exercise targeting lats and biceps"
    instructions:
      - "Hang from pull-up bar"
      - "Pull body up until chin over bar"
      - "Lower with control"
      - "Keep core engaged"
      - "Full range of motion"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "back", "bodyweight", "intermediate", "strength"]
    audio_file: "audio/workouts/pull_ups.mp3"

  - name: "Chin-ups"
    icon: "chinups"
    description: "Pull-up variation with underhand grip emphasizing biceps"
    instructions:
      - "Hang from bar with underhand grip"
      - "Pull up until chin over bar"
      - "Lower with control"
      - "Focus on bicep contraction"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "back", "bodyweight", "intermediate", "strength"]
    audio_file: "audio/workouts/chin_ups.mp3"

  - name: "Barbell row"
    icon: "barbell_row"
    description: "Back and bicep focused rowing movement"
    instructions:
      - "Bend over with slight knee bend"
      - "Pull barbell to lower chest"
      - "Squeeze shoulder blades together"
      - "Lower with control"
    default_sets: [1, 2, 3]
    default_reps: 8
    tags: ["gym", "back", "barbell", "intermediate", "strength"]
    audio_file: "audio/workouts/barbell_row.mp3"

  - name: "Lat pulldown"
    icon: "lat_pulldown"
    description: "Machine-based lat and upper back exercise"
    instructions:
      - "Sit at lat pulldown machine"
      - "Grip bar wider than shoulders"
      - "Pull bar to upper chest"
      - "Control the weight up"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "back", "machine", "beginner", "strength"]
    audio_file: "audio/workouts/lat_pulldown.mp3"

  - name: "Leg press"
    icon: "leg_press"
    description: "Machine-based leg exercise targeting quadriceps and glutes"
    instructions:
      - "Sit in leg press machine"
      - "Place feet shoulder-width on platform"
      - "Lower weight by bending knees"
      - "Press through heels to extend"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "legs", "machine", "beginner", "strength"]
    audio_file: "audio/workouts/leg_press.mp3"

  - name: "Dumbbell bench press"
    icon: "dumbbell_bench_press"
    description: "Chest exercise with dumbbells allowing greater range of motion"
    instructions:
      - "Lie on bench with dumbbells"
      - "Press dumbbells up and together"
      - "Lower with control"
      - "Feel stretch in chest"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "chest", "dumbbells", "beginner", "strength"]
    audio_file: "audio/workouts/dumbbell_bench_press.mp3"

  - name: "Dumbbell shoulder press"
    icon: "dumbbell_shoulder_press"
    description: "Shoulder pressing movement with dumbbells"
    instructions:
      - "Sit or stand with dumbbells at shoulders"
      - "Press overhead until arms straight"
      - "Lower with control"
      - "Keep core engaged"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "shoulders", "dumbbells", "beginner", "strength"]
    audio_file: "audio/workouts/dumbbell_shoulder_press.mp3"

  - name: "Bicep curls"
    icon: "bicep_curls"
    description: "Isolation exercise targeting biceps"
    instructions:
      - "Stand with dumbbells at sides"
      - "Curl weights up to shoulders"
      - "Squeeze biceps at top"
      - "Lower with control"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "arms", "dumbbells", "beginner", "strength"]
    audio_file: "audio/workouts/bicep_curls.mp3"

  - name: "Tricep pushdowns"
    icon: "tricep_pushdowns"
    description: "Isolation exercise targeting triceps"
    instructions:
      - "Stand at cable machine"
      - "Grip bar with palms down"
      - "Push down until arms straight"
      - "Control the weight up"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "arms", "cables", "beginner", "strength"]
    audio_file: "audio/workouts/tricep_pushdowns.mp3"

  - name: "Chest fly"
    icon: "chest_fly"
    description: "Chest isolation exercise emphasizing pectoral stretch"
    instructions:
      - "Lie on bench with dumbbells"
      - "Start with arms extended"
      - "Lower dumbbells in arc motion"
      - "Feel stretch in chest"
      - "Bring back together"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "chest", "dumbbells", "intermediate", "strength"]
    audio_file: "audio/workouts/chest_fly.mp3"

  - name: "Leg curl"
    icon: "leg_curl"
    description: "Hamstring isolation exercise"
    instructions:
      - "Lie face down on leg curl machine"
      - "Curl heels toward glutes"
      - "Squeeze hamstrings"
      - "Lower with control"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "legs", "machine", "beginner", "strength"]
    audio_file: "audio/workouts/leg_curl.mp3"

  - name: "Leg extension"
    icon: "leg_extension"
    description: "Quadriceps isolation exercise"
    instructions:
      - "Sit in leg extension machine"
      - "Extend legs until straight"
      - "Squeeze quadriceps"
      - "Lower with control"
    default_sets: [1, 2, 3]
    default_reps: 12
    tags: ["gym", "legs", "machine", "beginner", "strength"]
    audio_file: "audio/workouts/leg_extension.mp3"

  - name: "Plank"
    icon: "plank"
    description: "Core stability exercise targeting entire abdominal region"
    instructions:
      - "Start in push-up position"
      - "Hold body straight"
      - "Engage core muscles"
      - "Breathe normally"
      - "Hold for time"
    default_sets: [4, 5]
    default_reps: 0  # Duration-based
    default_duration: 60  # seconds
    tags: ["home", "core", "bodyweight", "beginner", "strength"]
    audio_file: "audio/workouts/plank.mp3"

  - name: "Hanging leg raises"
    icon: "hanging_leg_raises"
    description: "Advanced core exercise targeting lower abs"
    instructions:
      - "Hang from pull-up bar"
      - "Raise legs up"
      - "Keep core engaged"
      - "Lower with control"
    default_sets: [1, 2, 3]
    default_reps: 10
    tags: ["gym", "core", "bodyweight", "intermediate", "strength"]
    audio_file: "audio/workouts/hanging_leg_raises.mp3"

  # NOTE: "Treadmill running or walking" and "Stationary bike / spin bike"
  # moved to set1_workouts.yaml — they ship locked and unlock via the cards system.

  - name: "Bodyweight Squats"
    icon: "bodyweight_squats"
    description: "Bodyweight leg exercise targeting quadriceps and glutes"
    instructions:
      - "Stand with feet shoulder-width apart"
      - "Lower down by bending knees"
      - "Keep chest up"
      - "Drive through heels to stand"
    default_sets: [4, 5]
    default_reps: 15
    tags: ["home", "legs", "bodyweight", "beginner", "strength"]
    audio_file: "audio/workouts/bodyweight_squats.mp3"

  - name: "Lunges"
    icon: "lunges"
    description: "Unilateral leg exercise targeting quadriceps, glutes, and core"
    instructions:
      - "Step forward into lunge"
      - "Lower back knee toward ground"
      - "Keep front knee over ankle"
      - "Push back to start"
      - "Alternate legs"
    default_sets: [4, 5]
    default_reps: 12
    tags: ["home", "legs", "bodyweight", "beginner", "strength"]
    audio_file: "audio/workouts/lunges.mp3"

  - name: "Wall Sit"
    icon: "wall_sit"
    description: "Isometric leg exercise targeting quadriceps"
    instructions:
      - "Lean against wall"
      - "Slide down until knees at 90 degrees"
      - "Hold position"
      - "Keep back flat against wall"
    default_sets: [4, 5]
    default_reps: 0  # Duration-based
    default_duration: 45  # seconds
    tags: ["home", "legs", "bodyweight", "beginner", "strength"]
    audio_file: "audio/workouts/wall_sit.mp3"

  - name: "Glute Bridges"
    icon: "glute_bridges"
    description: "Glute and hamstring focused exercise"
    instructions:
      - "Lie on back with knees bent"
      - "Lift hips up"
      - "Squeeze glutes at top"
      - "Lower with control"
    default_sets: [4, 5]
    default_reps: 15
    tags: ["home", "glutes", "bodyweight", "beginner", "strength"]
    audio_file: "audio/workouts/glute_bridges.mp3"

  - name: "Push-ups"
    icon: "pushups"
    description: "Upper body pushing exercise targeting chest, shoulders, and triceps"
    instructions:
      - "Start in plank position"
      - "Lower body until chest near ground"
      - "Push up explosively"
      - "Keep body straight"
    default_sets: [4, 5]
    default_reps: 12
    tags: ["home", "chest", "bodyweight", "beginner", "strength"]
    audio_file: "audio/workouts/push_ups.mp3"

  - name: "Triceps Dips"
    icon: "triceps_dips"
    description: "Tricep and shoulder focused bodyweight exercise"
    instructions:
      - "Sit on edge of bench"
      - "Place hands behind you"
      - "Lower body by bending arms"
      - "Push back up"
    default_sets: [4, 5]
    default_reps: 10
    tags: ["home", "arms", "bodyweight", "intermediate", "strength"]
    audio_file: "audio/workouts/triceps_dips.mp3"

  - name: "Side Plank"
    icon: "side_plank"
    description: "Core exercise targeting obliques and lateral stability"
    instructions:
      - "Lie on side"
      - "Prop up on elbow"
      - "Lift hips off ground"
      - "Hold body straight"
      - "Hold for time"
    default_sets: [4, 5]
    default_reps: 0  # Duration-based
    default_duration: 45  # seconds
    tags: ["home", "core", "bodyweight", "intermediate", "strength"]
    audio_file: "audio/workouts/side_plank.mp3"

  - name: "Jumping Jacks"
    icon: "jumping_jacks"
    description: "Full-body cardiovascular exercise"
    instructions:
      - "Stand with feet together"
      - "Jump and spread legs"
      - "Raise arms overhead"
      - "Return to start"
      - "Repeat rhythmically"
    default_sets: [4, 5]
    default_reps: 20
    tags: ["home", "full_body", "bodyweight", "beginner", "cardio"]
    audio_file: "audio/workouts/jumping_jacks.mp3"

  - name: "Burpees"
    icon: "burpees"
    description: "High-intensity full-body exercise combining squat, push-up, and jump"
    instructions:
      - "Start standing"
      - "Squat down and place hands on ground"
      - "Jump feet back to plank"
      - "Do a push-up"
      - "Jump feet forward"
      - "Jump up with arms overhead"
    default_sets: [4, 5]
    default_reps: 10
    tags: ["home", "full_body", "bodyweight", "advanced", "cardio"]
    audio_file: "audio/workouts/burpees.mp3"

routines:
  - name: "Chest Day (Gym)"
    muscle_group: "chest"
    exercise_names:
      - "Bench press"
      - "Dumbbell bench press"
      - "Chest fly"
    tags: ["gym"]
    set_numbers: [1, 2, 3]

  - name: "Back Day (Gym)"
    muscle_group: "back"
    exercise_names:
      - "Pull-ups"
      - "Barbell row"
      - "Lat pulldown"
    tags: ["gym"]
    set_numbers: [1, 2, 3]

  - name: "Leg Day (Gym)"
    muscle_group: "legs"
    exercise_names:
      - "back squat"
      - "Leg press"
      - "Leg extension"
    tags: ["gym"]
    set_numbers: [1, 2, 3]

  - name: "Arms Day (Gym)"
    muscle_group: "arms"
    exercise_names:
      - "Bicep curls"
      - "Tricep pushdowns"
      - "Chin-ups"
    tags: ["gym"]
    set_numbers: [1, 2, 3]

  - name: "Shoulders Day (Gym)"
    muscle_group: "shoulders"
    exercise_names:
      - "Overhead press"
      - "Dumbbell shoulder press"
      - "Pull-ups"
    tags: ["gym"]
    set_numbers: [1, 2, 3]

  - name: "Core Day (Gym)"
    muscle_group: "core"
    exercise_names:
      - "Hanging leg raises"
      - "Plank"
      - "Side Plank"
    tags: ["gym"]
    set_numbers: [1, 2, 3]

  - name: "Full Body Home"
    muscle_group: "full_body"
    exercise_names:
      - "Push-ups"
      - "Burpees"
      - "Jumping Jacks"
    tags: ["home"]
    set_numbers: [4, 5]

  - name: "Legs Home"
    muscle_group: "legs"
    exercise_names:
      - "Bodyweight Squats"
      - "Lunges"
      - "Wall Sit"
    tags: ["home"]
    set_numbers: [4, 5]

  - name: "Core Home"
    muscle_group: "core"
    exercise_names:
      - "Plank"
      - "Side Plank"
      - "Glute Bridges"
    tags: ["home"]
    set_numbers: [4, 5]
