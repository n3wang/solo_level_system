# App Themes Configuration
# Edit this file to customize colors, fonts, and sizes across the entire app
# Changes will apply after restarting the app

# =============================================================================
# DEFAULT THEME - The main theme used by the app
# =============================================================================
default:
  name: "Default"

  # 5 Core Colors (must provide exactly 5)
  colors:
    color1: "#9C27B0"  # Purple - Primary/Accent
    color2: "#2196F3"  # Blue - Info
    color3: "#4CAF50"  # Green - Success
    color4: "#FF9800"  # Orange - Warning
    color5: "#F44336"  # Red - Error

  # Background Colors
  backgrounds:
    primary: "#FFFFFF"    # Main background (light mode)
    secondary: "#F5F5F5"  # Secondary background
    surface: "#FFFFFF"    # Card/surface background
    dark: "#121212"       # Main background (dark mode)
    darkSecondary: "#1E1E1E"  # Secondary background (dark)
    darkSurface: "#2C2C2C"    # Card/surface (dark)

  # 3 Font Families
  fonts:
    primary: "Roboto"      # Main text font
    secondary: "Poppins"   # Headings/titles
    monospace: "Courier"   # Code/monospace text

  # 3 Font Sizes (base sizes - will be scaled appropriately)
  fontSizes:
    small: 12.0   # Small text (captions, hints)
    medium: 16.0  # Body text
    large: 24.0   # Headings

